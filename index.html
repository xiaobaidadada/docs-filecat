<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileCat 文档</title>
    <meta name="description" content="FileCat 是一个开源的自托管文件管理工具，支持 Web 文件管理、在线预览、SSH 终端、内网穿透等功能。">

    <!-- 亮/暗主题色，移动端浏览器地址栏跟着变 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">

    <!-- 设计变量必须最先加载，后续 css 都依赖它 -->
    <link rel="stylesheet" href="code/css/theme.css">
    <link rel="stylesheet" href="code/css/new-github-markdown.css">
    <link rel="stylesheet" href="code/css/docs.css">
    <link rel="stylesheet" href="code/css/header.css">
    <link rel="stylesheet" href="code/css/main.css">
    <link rel="stylesheet" href="code/css/menu.css">
    <link rel="stylesheet" href="code/css/home.css">

    <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="code/resource/favicon-32x32.png"
    />
</head>
<body>
<header class="header">
    <!-- 移动端汉堡按钮，桌面端由 css 隐藏 -->
    <div id="menu-change-button" class="header-menu">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <a href="./" class="brand">
        <img class="brand-logo" src="code/resource/favicon-32x32.png" alt="">
        <span class="brand-name">FileCat</span>
        <span class="brand-tag">Docs</span>
    </a>

    <!-- 当前页面标题，由 js 写入文档标题 -->
    <div class="header-title" id="header-title"></div>

    <!-- 语言切换：显示的是「切换目标」语言 -->
    <a href="#" class="lang-switch" id="lang-switch" title="Switch language">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18"/>
            <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
        </svg>
        <span id="lang-switch-text">中文</span>
    </a>

    <a href="https://github.com/xiaobaidadada/filecat" target="_blank" rel="noopener" class="github-corner" title="GitHub">
        <!-- 用相对路径，部署到任意子目录都不会 404 -->
        <img src="code/resource/github.svg" alt="GitHub">
    </a>
</header>

<!--菜单-->
<div id="menu" class="markdown-body menu-mobile menu-mobile-hidden"></div>

<main>
    <!-- 文档渲染结果容器 -->
    <div id="preview" class="markdown-body"></div>

    <!-- 官网首页：无 hash 时显示，文档页自动隐藏 -->
    <div id="home">
        <section class="home-hero">
            <div class="home-hero-inner">
                <div class="home-hero-copy">
                    <div class="home-badge">
                        <a class="home-badge-link" href="https://www.npmjs.com/package/filecat" target="_blank"
                           rel="noopener">
                            <span class="home-badge-label" data-i18n="badge_label">release</span>
                            <span class="home-badge-value" id="badge-version">latest</span>
                        </a>
                        <a class="home-badge-link home-badge-link-release"
                           href="https://github.com/xiaobaidadada/filecat/releases" target="_blank" rel="noopener"
                           title="GitHub Releases">
                            <span class="home-badge-label">github</span>
                        </a>
                    </div>

                    <h1 class="home-title">
                        <span class="home-title-icon">
                            <img src="code/resource/logo.svg" alt="FileCat logo">
                        </span>
                        FileCat
                    </h1>

                    <p class="home-desc" data-i18n="desc"></p>

                    <div class="home-actions">
                        <a class="home-btn home-btn-primary" href="#/en/install.md">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/>
                                <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5A1.5 1.5 0 0 0 20 18.5z"/>
                            </svg>
                            <span data-i18n="btn_docs"></span>
                        </a>
                        <a class="home-btn home-btn-secondary" href="https://github.com/xiaobaidadada/filecat" target="_blank" rel="noopener">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.51 2.87 8.34 6.84 9.69.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05.8-.23 1.65-.34 2.5-.34.85 0 1.7.11 2.5.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.23C22 6.58 17.52 2 12 2z"/>
                            </svg>
                            <span data-i18n="btn_github"></span>
                        </a>
                    </div>
                </div>

                <div class="home-hero-shot">
                    <div class="home-hero-shot-frame">
                        <img id="home-shot" src="code/resource/en-home.png" alt="" loading="eager">
                    </div>
                </div>
            </div>
        </section>

        <section class="home-section">
            <div class="home-section-inner">
                <div class="home-section-head">
                    <h2 class="home-section-title" data-i18n="section_title"></h2>
                    <p class="home-section-desc" data-i18n="section_desc"></p>
                </div>

                <!-- 功能网格由 i18n 数据渲染 -->
                <div class="home-grid" id="home-grid"></div>
            </div>
        </section>

        <footer class="home-footer">
            © <span id="home-year">2026</span> FileCat · <span data-i18n="footer_built_by"></span>
            <a href="https://github.com/xiaobaidadada" target="_blank" rel="noopener">xiaobaidadada</a>
        </footer>
    </div>
</main>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        // 保证以 / 结尾 避免出现 js css 资源项目路径访问问题
        const {pathname} = window.location;
        // 检查路径名是否带有文件后缀
        const hasExtension = pathname.lastIndexOf('.') > pathname.lastIndexOf('/');
        if (!hasExtension && !pathname.endsWith('/')) {
            window.location.pathname += '/';
        }
    });
</script>
<script type="module" src="code/js/docs.js"></script>
<script src="code/js/init.js"></script>
</body>
</html>
